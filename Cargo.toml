[package]
name = "hyprforge-greet"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A greetd greeter for Hyprland, sharing its look and authentication conversation with the lock screen."
repository = "https://github.com/hyprforge-suite/hyprforge"
documentation = "https://docs.rs/hyprforge-greet"
readme = "README.md"
keywords = ["hyprland", "wayland", "greetd", "greeter", "login"]
categories = ["gui", "os::linux-apis", "authentication"]

[[bin]]
name = "hyprforge-greet"
path = "src/main.rs"

[dependencies]
# By crates.io version: this manifest has to work unchanged both inside
# the Hyprforge workspace, where this directory is a submodule and the
# root Cargo.toml's `[patch.crates-io]` section points these back at the
# local `crates/` directories, and as the root of this component's own
# repository, where cargo fetches the published crates.
hyprforge-authui = "0.1"
hyprforge-look = "0.1"
# The same crate greetd itself uses, so the framing and the JSON tags
# cannot drift from the daemon's. sync-codec rather than tokio: this
# talks to greetd from a worker thread, exactly as the lock screen talks
# to PAM, so there is nothing here for an async runtime to do.
greetd_ipc = { version = "0.10", features = ["sync-codec"] }
thiserror = "2"
# `web-colors` is in iced's own default features and is the reason the
# greeter looked washed out beside the lock screen — see CLAUDE.md.
# default-features = false with exactly this feature list is load
# bearing; do not add `web-colors` back.
#
# image support comes via iced_widget rather than iced's own `image`
# feature: that one pulls the avif encoder (ravif -> rav1e -> profiling
# 1.0.18), whose macro crate is not published at a matching version, so
# the workspace stops resolving. Features are additive, so enabling it
# on iced_widget reaches the same renderer without the encoder.
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "tokio",
] }
iced_widget = { version = "0.14", features = ["image"] }
# default-features = false: no serde, no oldtime, no wasm bindings — a
# login screen wants the smallest thing that can format a strftime
# string.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# The live test lists the compositor's globals; nothing else here speaks
# Wayland directly — iced does, through winit.
wayland-client = "0.31"
